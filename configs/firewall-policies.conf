# ============================================================
# FortiGate Firewall Lab - CLI Configuration
# Author: Manoj Kumar V M
# Description: Sample firewall policies with NAT
# ============================================================

# ---------- Interface Configuration ----------
config system interface
    edit "port1"
        set vdom "root"
        set ip 192.168.1.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set alias "WAN"
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 10.0.0.1 255.255.255.0
        set allowaccess ping https ssh
        set type physical
        set alias "LAN"
        set role lan
    next
end

# ---------- Address Objects ----------
config firewall address
    edit "LAN_Subnet"
        set subnet 10.0.0.0 255.255.255.0
    next
    edit "all"
        set subnet 0.0.0.0 0.0.0.0
    next
end

# ---------- Firewall Policies ----------
config firewall policy

    # Policy 1: LAN --> WAN (Allow with NAT)
    edit 1
        set name "LAN-to-WAN-Allow"
        set srcintf "port2"
        set dstintf "port1"
        set srcaddr "LAN_Subnet"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTP" "HTTPS" "DNS" "PING"
        set nat enable
        set logtraffic all
        set comments "Allow outbound web and DNS traffic from LAN with NAT"
    next

    # Policy 2: WAN --> LAN (Deny)
    edit 2
        set name "WAN-to-LAN-Deny"
        set srcintf "port1"
        set dstintf "port2"
        set srcaddr "all"
        set dstaddr "LAN_Subnet"
        set action deny
        set schedule "always"
        set service "ALL"
        set logtraffic all
        set comments "Block all unsolicited inbound traffic from WAN"
    next

    # Policy 3: Management Access (Optional - Restrict in production)
    edit 3
        set name "Management-Access"
        set srcintf "port1"
        set dstintf "port1"
        set srcaddr "all"
        set dstaddr "all"
        set action accept
        set schedule "always"
        set service "HTTPS" "SSH" "PING"
        set logtraffic all
        set comments "Allow management access (restrict source IP in real environments)"
    next

end

# ---------- Optional: Enable Logging ----------
config log memory setting
    set status enable
end

config log disk setting
    set status enable
end
